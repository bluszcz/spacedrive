[package]
name = "sd-braw"
version = "0.1.0"
description = "BlackmagicRAW support for Spacedrive"
authors = ["Spacedrive Technology Inc."]
license.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
thiserror = { workspace = true }
image = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt-multi-thread", "io-util", "macros", "process", "sync", "time"] }
libc = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true, features = ["derive"] }
specta = { workspace = true, features = ["serde"] }
chrono = { workspace = true, features = ["serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "0.9", optional = true }

[build-dependencies]
bindgen = "0.69"

[features]
default = []

# Enable BlackmagicRAW functionality using CLI placeholder implementation.
with-sdk = []

# Enable direct native FFI bindings to the BlackmagicRAW C++ SDK. Requires a working SDK installation and clang.
# This is experimental and disabled by default.
native-ffi = ["core-foundation"]

# Enable real BlackmagicRAW SDK integration (requires proper SDK installation)
real-braw-sdk = ["with-sdk", "native-ffi"]
